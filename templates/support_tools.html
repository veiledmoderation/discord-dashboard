<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <style>
        body { background:#0d0d0d; color:#e0e0e0; font-family:Arial; margin:0; }
        header { background:#1a1a1a; padding:20px; border-bottom:1px solid #333;
                 display:flex; justify-content:space-between; }
        .container { padding:40px; }
        .section { background:#1a1a1a; padding:25px; border-radius:10px;
                   border:1px solid #333; margin-bottom:25px; }
        input, textarea { width:100%; padding:10px; background:#0d0d0d;
                          border:1px solid #333; border-radius:6px; color:#e0e0e0; }
        button { margin-top:15px; padding:10px 18px; background:#4a4aff;
                 color:white; border:none; border-radius:6px; cursor:pointer; }
        button:hover { background:#6a6aff; }
        .ticket { background:#0d0d0d; padding:15px; border-radius:8px;
                  border:1px solid #333; margin-bottom:10px; }
    </style>
</head>
<body>

<header>
    <h1>Support Tools</h1>
    <div>Logged in as <strong>{{ user.username }}</strong></div>
</header>

<div class="container">

    <div class="section">
        <h2>Create Ticket</h2>
        <form method="POST" action="/support/create">
            <label>Issue</label>
            <textarea name="issue" rows="4"></textarea>
            <button>Create Ticket</button>
        </form>
    </div>

    <div class="section">
        <h2>Tickets</h2>
        {% if tickets %}
            {% for t in tickets %}
                <div class="ticket">
                    <strong>ID:</strong> {{ t.id }}<br>
                    <strong>Issue:</strong> {{ t.issue }}<br>
                    <strong>Status:</strong> {{ t.status }}<br>
                </div>
            {% endfor %}
        {% else %}
            <p>No tickets found.</p>
        {% endif %}
    </div>

</div>

</body>
</html>
