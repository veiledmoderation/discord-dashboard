{% extends "base.html" %}
{% block content %}
<h1>Announcements</h1>

<h2>Create Announcement</h2>
<form method="POST" action="/announcements/create" class="cyber-form">
    <label>Title</label>
    <input type="text" name="title" class="cyber-input">
    <label>Content</label>
    <textarea name="content" class="cyber-textarea"></textarea>
    <label>Channel</label>
    <select name="channel_id" class="cyber-select">
        {% for ch in channels %}
        <option value="{{ ch.id }}">{{ ch.name }} ({{ ch.id }})</option>
        {% endfor %}
    </select>
    <button class="cyber-button">Create Announcement</button>
</form>

<h2>Existing Announcements</h2>
<ul class="cyber-list">
    {% for a in announcements %}
    <li><strong>{{ a.title }}</strong> — {{ a.content }}</li>
    {% endfor %}
</ul>
{% endblock %}
