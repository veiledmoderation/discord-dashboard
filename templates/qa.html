{% extends "base.html" %}
{% block content %}
<h1>Q&A</h1>
<table class="cyber-table">
    <tr>
        <th>ID</th>
        <th>Question</th>
        <th>Answer</th>
        <th>Edit</th>
    </tr>
    {% for q in questions %}
    <tr>
        <td>{{ q.id }}</td>
        <td>{{ q.question }}</td>
        <td>{{ q.answer }}</td>
        <td><a href="/qna/edit/{{ q.id }}">Edit</a></td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
