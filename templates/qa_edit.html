{% extends "base.html" %}
{% block content %}
<h1>Edit Q&A</h1>
<p><strong>Question:</strong> {{ question.question }}</p>
<form method="POST" class="cyber-form">
    <label>Answer</label>
    <textarea name="answer" class="cyber-textarea">{{ question.answer }}</textarea>
    <button class="cyber-button">Save</button>
</form>
{% endblock %}
