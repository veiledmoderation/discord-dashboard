<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rituals Staff Login</title>
    <link rel="stylesheet" href="/static/css/cyber.css">
</head>
<body class="cyber-body">
<div class="login-shell">
    <h1>Staff Login</h1>
    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST" class="cyber-form">
        <label>Username</label>
        <input type="text" name="username" class="cyber-input">
        <label>Password</label>
        <input type="password" name="password" class="cyber-input">
        <button class="cyber-button">Login</button>
    </form>
</div>
</body>
</html>
