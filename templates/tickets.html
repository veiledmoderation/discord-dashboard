{% extends "base.html" %}
{% set page_title = "Tickets" %}

{% block body %}
<div class="vm-dashboard-grid">

    <div class="vm-card vm-card-wide">
        <div class="vm-card-header"><span class="vm-card-title">Tickets</span></div>
        <div class="vm-card-body">

            {% if tickets %}
                <ul class="vm-list">
                    {% for t in tickets %}
                    <li class="vm-list-item">
                        <a href="/tickets/view/{{ t.id }}">
                            <strong>{{ t.subject }}</strong>
                            <span class="vm-tag">{{ t.status }}</span>
                        </a>
                    </li>
                    {% endfor %}
                </ul>
            {% else %}
                <p class="vm-empty">No tickets found.</p>
            {% endif %}

        </div>
    </div>

</div>
{% endblock %}
