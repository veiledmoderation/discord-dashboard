<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title or "VeilMod Login" }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cyber_animations.css') }}">
</head>
<body class="vm-body vm-login-body">
    <div class="vm-login-wrap">
        <div class="vm-login-card">
            <div class="vm-login-logo">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="VeilMod" class="vm-logo">
            </div>
            <h1 class="vm-login-title">VeilMod Command Center</h1>
            <p class="vm-login-subtitle">Staff access only</p>

            {% block content %}{% endblock %}
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/cyber_animations.js') }}"></script>
</body>
</html>
