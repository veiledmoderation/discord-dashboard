<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <style>
        body {
            background: #0d0d0d;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background: #1a1a1a;
            padding: 20px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            margin: 0;
        }
        .user-box {
            font-size: 14px;
            opacity: 0.8;
        }
        .container {
            padding: 40px;
        }
        .section {
            background: #1a1a1a;
            padding: 25px;
            border-radius: 10px;
            border: 1px solid #333;
            margin-bottom: 25px;
        }
        .section h2 {
            margin-top: 0;
        }
        label {
            display: block;
            margin: 10px 0 5px;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            background: #0d0d0d;
            border: 1px solid #333;
            border-radius: 6px;
            color: #e0e0e0;
        }
        button {
            margin-top: 15px;
            padding: 10px 18px;
            background: #4a4aff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background: #6a6aff;
        }
    </style>
</head>
<body>

<header>
    <h1>Settings</h1>
    <div class="user-box">
        Logged in as <strong>{{ user.username }}</strong>
    </div>
</header>

<div class="container">

    <div class="section">
        <h2>Account Settings</h2>
        <p>Basic account information from Discord.</p>

        <label>Username</label>
        <input type="text" value="{{ user.username }}" disabled>

        <label>User ID</label>
        <input type="text" value="{{ user.id }}" disabled>

        <label>Avatar</label>
        <input type="text" value="{{ user.avatar }}" disabled>
    </div>

    <div class="section">
        <h2>Dashboard Settings</h2>
        <p>More settings will be added soon.</p>
        <button disabled>Coming Soon</button>
    </div>

</div>

</body>
</html>
