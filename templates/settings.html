{% extends "base.html" %}
{% block content %}
<h1>Settings</h1>
<form method="POST" action="/settings/update" class="cyber-form">
    <label>Prefix</label>
    <input type="text" name="prefix" class="cyber-input" value="{{ settings.prefix or '!' }}">
    <label>Log Channel ID</label>
    <input type="text" name="log_channel" class="cyber-input" value="{{ settings.log_channel or '' }}">
    <label>Staff Role ID</label>
    <input type="text" name="staff_role" class="cyber-input" value="{{ settings.staff_role or '' }}">
    <label>Ticket Category ID</label>
    <input type="text" name="ticket_category" class="cyber-input" value="{{ settings.ticket_category or '' }}">
    <button class="cyber-button">Save Settings</button>
</form>
{% endblock %}
