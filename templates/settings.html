{% extends "base.html" %}
{% set page_title = "Settings" %}

{% block body %}
<div class="vm-dashboard-grid">

    <div class="vm-card vm-card-wide">
        <div class="vm-card-header"><span class="vm-card-title">Settings</span></div>
        <div class="vm-card-body">

            <form method="POST" action="/settings/update" class="vm-form">

                <label>Prefix</label>
                <input class="vm-input" name="prefix" value="{{ settings.prefix }}">

                <label>Log Channel</label>
                <input class="vm-input" name="log_channel" value="{{ settings.log_channel }}">

                <label>Staff Role</label>
                <input class="vm-input" name="staff_role" value="{{ settings.staff_role }}">

                <label>Ticket Category</label>
                <input class="vm-input" name="ticket_category" value="{{ settings.ticket_category }}">

                <button class="vm-btn vm-btn-primary">Save</button>
            </form>

        </div>
    </div>

</div>
{% endblock %}
