<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Unauthorized</title>
    <style>
        body {
            background: #0d0d0d;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .box {
            background: #1a1a1a;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #333;
            width: 350px;
        }
        h1 {
            margin-bottom: 10px;
            color: #ff4a4a;
        }
        p {
            margin-bottom: 20px;
        }
        a {
            display: inline-block;
            padding: 10px 18px;
            background: #4a4aff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
        a:hover {
            background: #6a6aff;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Access Denied</h1>
        <p>You do not have permission to view this page.</p>
        <a href="/dashboard">Return to Dashboard</a>
    </div>
</body>
</html>
