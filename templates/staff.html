{% extends "base.html" %}
{% set page_title = "Staff" %}

{% block body %}
<div class="vm-dashboard-grid">

    <div class="vm-card vm-card-wide">
        <div class="vm-card-header"><span class="vm-card-title">Staff Members</span></div>
        <div class="vm-card-body">

            {% if staff %}
                <ul class="vm-list">
                    {% for s in staff %}
                    <li class="vm-list-item">
                        <a href="/staff/profile/{{ s.user_id }}">
                            <strong>{{ s.name }}</strong>
                            <span class="vm-tag">{{ s.role }}</span>
                        </a>
                    </li>
                    {% endfor %}
                </ul>
            {% else %}
                <p class="vm-empty">No staff found.</p>
            {% endif %}

        </div>
    </div>

</div>
{% endblock %}
