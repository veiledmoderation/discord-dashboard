{% extends "base.html" %}
{% block content %}

<div class="section">
    <h2>User Profile</h2>
</div>

<div class="section">
    <h3>{{ user.username }}</h3>
    <p>ID: {{ user.id }}</p>
    <p>Avatar: {{ user.avatar }}</p>
</div>

<div class="section">
    <h3>Permissions</h3>
    <ul>
        {% for perm in permissions %}
            <li>{{ perm }}</li>
        {% endfor %}
    </ul>
</div>

{% endblock %}
