{% extends "base.html" %}
{% block content %}
<h1>Ping Everyone</h1>

<h2>Send Ping</h2>
<form method="POST" action="/ping-everyone/send" class="cyber-form">
    <label>Channel ID</label>
    <input type="text" name="channel_id" class="cyber-input">
    <label>Message</label>
    <textarea name="message" class="cyber-textarea"></textarea>
    <button class="cyber-button">Send Ping</button>
</form>

<h2>Ping History</h2>
<ul class="cyber-list">
    {% for p in pings %}
    <li>{{ p.time }} — {{ p.text }}</li>
    {% endfor %}
</ul>
{% endblock %}
